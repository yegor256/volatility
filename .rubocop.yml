plugins: rubocop-rspec

AllCops:
  NewCops: disable
  Exclude:
    - 'assets/**/*'
  DisplayCopNames: true
  TargetRubyVersion: 4.0

Style/GlobalVars:
  Enabled: false
Layout/LineLength:
  Max: 100
Layout/EndOfLine:
  EnforcedStyle: lf
Metrics/BlockLength:
  Max: 30
Layout/ParameterAlignment:
  Enabled: false
Layout/EmptyLineAfterGuardClause:
  Enabled: false

# The gem's runtime minimum differs from the Ruby 4 development toolchain.
Gemspec/RequiredRubyVersion:
  Enabled: false
